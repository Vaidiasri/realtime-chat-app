# Render Blueprint: one Docker web service (API, sockets and the built client on one port)
# plus a free Postgres. Deploy with New > Blueprint in the Render dashboard.
services:
  - type: web
    name: realtime-chat
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: realtime-chat-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: '1'
      - key: SEED_DEMO
        value: 'true'

databases:
  - name: realtime-chat-db
    plan: free
    postgresMajorVersion: '17'
